<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>易筋堂線上預約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#F5EDE0;--card:#FBF6EE;--ink:#5C3D1E;--mut:#8A7560;--red:#9B1B1B;--gold:#8B6914;--line:#C9A96E;--bd:#E4D4B4;--hl:#F4E3BF;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1712;--card:#2b2019;--ink:#f1e4d0;--mut:#b9a58d;--red:#b3261e;--gold:#d4b06a;--line:#6b5430;--bd:#4a3a2a;--hl:#3a2b20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1712;--card:#2b2019;--ink:#f1e4d0;--mut:#b9a58d;--red:#b3261e;--gold:#d4b06a;--line:#6b5430;--bd:#4a3a2a;--hl:#3a2b20;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{text-align:center;padding:34px 16px 0}
header h1{margin:0 -.3em 0 0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900;font-size:42px;line-height:1.2;letter-spacing:.3em;color:var(--red)}
header p{margin:12px 0 0;font-size:15px;color:var(--mut);letter-spacing:.2em}
.orn{display:flex;align-items:center;gap:12px;margin:22px 0 0}
.orn i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.orn s{flex:1;height:1.5px;background:var(--line)}
main{max-width:560px;margin:0 auto;padding:6px 14px 40px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:24px;padding:20px 18px;margin:20px 0}
h2{margin:0 0 16px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900;font-size:19px;color:var(--red)}
.news{background:var(--hl);border-left:5px solid var(--line);border-radius:8px 24px 24px 8px;padding:18px;margin:20px 0}
.news h3{margin:0 0 10px;font-size:17px}
.news .l{line-height:1.9;font-size:15px}
.news hr{border:0;border-top:1.5px dashed var(--line);margin:12px 0}
.news .t{font-size:13.5px;line-height:1.8;color:var(--mut)}
.row{display:grid;gap:10px}
.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:16px 8px;text-align:center;cursor:pointer;line-height:1.4}
.opt.on{background:var(--red);border-color:var(--red);color:#fff}
.opt b{display:block;font-size:17px;font-weight:500}
.opt span{display:block;font-size:15px}
.sub{font-size:17px;font-weight:700;margin:24px 0 12px}
.warn{background:var(--hl);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.8;margin-top:20px}
.warn a{color:var(--red);font-weight:700;text-decoration:underline}
.note{font-size:13px;color:var(--mut);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--bd);border-radius:999px;padding:10px 18px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font-size:15px;letter-spacing:.1em}
.nav button{font:inherit;font-size:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--gold);cursor:pointer}
.nav button:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.w{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.d{font:inherit;font-size:15px;color:var(--ink);aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.15}
.d small{font-size:10px;color:var(--mut);min-height:12px}
.d:disabled{background:transparent;border-color:transparent;color:var(--mut);opacity:.55;cursor:default}
.d.on{background:var(--red);border-color:var(--red);color:#fff}
.d.on small{color:#fff}
label.f{display:block;font-size:13px;color:var(--gold);margin:14px 0 6px;font-weight:600}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px}
.tip{background:var(--hl);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px;line-height:1.7}
.go{width:100%;font:inherit;font-size:16px;letter-spacing:.2em;color:#fff;background:var(--red);border:0;border-radius:14px;padding:14px;cursor:pointer;margin-top:6px}
#res{margin-top:14px;font-size:14px;color:var(--red)}
.tinfo{border:1.5px solid var(--bd);border-radius:20px;padding:18px 16px;margin-top:16px;text-align:center}
.tinfo img{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px}
.tinfo h3{margin:0 0 10px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:19px}
.tg{display:inline-block;font-size:13px;border-radius:999px;padding:5px 14px;margin:3px 2px;background:var(--hl);color:var(--gold);border:1px solid var(--line)}
.tg.m{background:var(--red);border-color:var(--red);color:#fff}
.tinfo p{margin:12px 0 0;font-size:14px;line-height:1.8;text-align:left}
.tinfo .red{color:var(--red);font-weight:700;margin-top:14px}
.tinfo .red a{color:var(--red);text-decoration:underline}
footer{text-align:center;font-size:12px;color:var(--mut);padding:6px 0 0}
</style>
</head>
<body>
<header><h1>易筋堂</h1><p>傳統整復推拿 線上預約</p><div class="orn"><i></i><s></s><i></i></div></header>
<main>


<section class="card"><h2>一、選擇方案與老師</h2><div class="row two" id="plan"></div>
<div class="sub">指定老師</div><div class="chips" id="tch"></div><div id="tinfo"></div></section>

<section class="card"><h2>二、選擇日期與時段</h2>
<div class="nav"><button type="button" id="pv" data-a="nav" data-v="-1">‹</button><b id="mt"></b><button type="button" id="nx" data-a="nav" data-v="1">›</button></div>
<div class="grid" id="cal"></div>
<label class="f" id="sl" style="display:none">選擇時間</label><div class="chips" id="slots"></div></section>

<section class="card"><h2>三、基本資料</h2>
<label class="f" for="nm">中文全名</label><input type="text" id="nm" autocomplete="name" placeholder="請輸入中文全名">
<label class="f" for="ph">手機號碼</label><input type="tel" id="ph" autocomplete="tel" inputmode="tel" placeholder="請輸入手機號碼">
<label class="f">是否為本人預約</label><div class="chips" id="self"></div>
<label class="f">如何得知本店？</label><div class="chips" id="src"></div></section>

<section class="card"><h2>四、整復前安心確認</h2><p class="note" style="font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:900;font-size:19px;color:var(--red)">初次預約者請務必填寫</p>
<label class="f">先前是否有推拿整復或按摩的經驗？</label><div class="chips" id="exp"></div>
<label class="f">若有需避開的部位或特殊狀況，請勾選或告知我們：</label><div class="chips" id="av"></div>
<input type="text" id="oc" placeholder="其他特殊狀況或避開部位（選填）" style="margin-top:10px">
<div class="tip">💡 <b>貼心提醒：</b><br>我們的老師皆具備專業手法，過程中若有力道調整需求，或對特定動作感到不安，請務必隨時告知老師，我們會立即為您調整。感謝😊</div>
<label class="f" for="mm">留言備註</label><textarea id="mm" placeholder="若有額外需求或手術部位請在此留言"></textarea></section>

<button type="button" class="go" id="go">確認送出預約</button>
<div id="res"></div>
<footer>新北市永和區信義路88號 · 頂溪捷運站步行 5 分鐘</footer>
</main>

'李老師':{m:'整復師',g:['軟組織調理 頭薦力學調理','經絡調理 能量耳穴'],d:['以經絡為出發點，針對氣虛濕冷體質做調理。利用徒手或工具為深淺層肌肉做放鬆。']},
'田老師':{m:'整復師',g:['身體結構調理 肢體平衡','整復推拿 骨盆調理'],d:['精通體態調整，擁有傷科經驗。從筋骨調理到整體舒緩，田老師專注於讓每一位客人找回輕鬆自在的身體。']},
'張老師':{m:'整復師',g:['牛角理筋鬆筋 被動式伸展','肢體平衡 身體結構調整'],d:['擅長筋膜結構，針對沾黏處筋結點以徒手或牛角撥筋做舒緩。擁有多年傷科經驗，手法偏中式。適合喜歡深層放鬆的客人。']}
};
const PL={60:'60分鐘',120:'120分鐘'};
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const S={p:60,t:'any',y:today.getFullYear(),m:today.getMonth(),date:null,slot:null,self:'是',src:'網路',exp:'',av:[]};
// 各老師班表：回傳 [開始,結束) 小時；休假回傳 null（日曆上不顯示任何字，只是不能點）
const sh=(t,d)=>({'田老師':[1,3].includes(d)?null:[10,21],'張老師':d===0?null:[18,21],'李老師':{1:[10,17],3:[10,17],2:[14,17],4:[14,17]}[d]||null}[t]);
function free(t,dt){const d=dt.getDay(),L=t==='any'?T:[t];let hs=false,out=[];
H.forEach(h=>{let ok=false;L.forEach(x=>{const s=sh(x,d);if(s){hs=true;if(h>=s[0]&&h<s[1])ok=true}});if(ok)out.push(h)});return{hs,out}}
const chip=(a,v,l,on)=>`<button type="button" class="chip${on?' on':''}" data-a="${a}" data-v="${v}">${l}</button>`;
function draw(){
$('plan').innerHTML=Object.keys(PL).map(k=>`<button type="button" class="opt${S.p==k?' on':''}" data-a="p" data-v="${k}"><b>${PL[k].replace('分鐘',' 分鐘')}</b><span>全方位放鬆整復</span></button>`).join('');
$('tch').innerHTML=chip('t','any','不指定',S.t==='any')+TC.map(t=>chip('t',t,t,S.t===t)).join('');
const ti=TI[S.t];
$('tinfo').innerHTML=ti?`<div class="tinfo"><img src="${IMG[S.t]}" alt="${S.t}"><h3>${S.t}</h3><span class="tg m">${ti.m}</span><br>${ti.g.map(x=>`<span class="tg">${x}</span>`).join('')}${ti.d.map(x=>`<p>${x}</p>`).join('')}${S.t==='游老師'?'<p class="red">游老師班表不定，若要指定游老師者請直接<a href="https://lin.ee/XXKdY86">聯繫小編</a></p>':''}</div>`:'';
$('mt').textContent=S.y+' 年 '+(S.m+1)+' 月';
$('pv').disabled=S.y===today.getFullYear()&&S.m===today.getMonth();
$('nx').disabled=(S.y*12+S.m)-(today.getFullYear()*12+today.getMonth())>=1;
const first=new Date(S.y,S.m,1).getDay(),days=new Date(S.y,S.m+1,0).getDate();
let h=['日','一','二','三','四','五','六'].map(w=>`<div class="w">${w}</div>`).join('')+'<div></div>'.repeat(first);
for(let d=1;d<=days;d++){const dt=new Date(S.y,S.m,d),past=dt<today,f=free(S.t,dt),dis=past||!f.hs,on=S.date&&+S.date===+dt;
h+=`<button type="button" class="d${on?' on':''}" ${dis?'disabled':''} data-a="d" data-v="${d}">${d}<small></small></button>`}
$('cal').innerHTML=h;
const fs=S.date?free(S.t,S.date).out:[];
$('sl').style.display=S.date?'block':'none';
$('slots').innerHTML=fs.map(x=>chip('s',x,x+':00',S.slot===x)).join('');
$('self').innerHTML=['是','否'].map(x=>chip('self',x,x,S.self===x)).join('');
$('src').innerHTML=['網路','親友介紹','路過','住附近'].map(x=>chip('src',x,x,S.src===x)).join('');
$('exp').innerHTML=['是','否'].map(x=>chip('exp',x,x,S.exp===x)).join('');
$('av').innerHTML=['懷孕','曾動過手術（請在備註補充手術部位）','皮膚較敏感','無特殊狀況'].map(x=>chip('av',x,x,S.av.includes(x))).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='p')S.p=+v;
else if(a==='t'){S.t=v;S.slot=null;if(S.date&&!free(S.t,S.date).out.length)S.date=null}
else if(a==='nav'){const n=S.y*12+S.m+ +v;S.y=Math.floor(n/12);S.m=n%12}
else if(a==='d'){S.date=new Date(S.y,S.m,+v);S.slot=null}
else if(a==='s')S.slot=+v;
else if(a==='av'){S.av=S.av.includes(v)?S.av.filter(x=>x!==v):S.av.concat(v)}
else S[a]=v;
draw()});

// 表單送出處理
$('go').onclick=()=>{
const r=$('res'),name=$('nm').value.trim(),phone=$('ph').value.trim();
if(S.t==='游老師'){r.textContent='游老師班表不定，若要指定游老師者請直接聯繫小編。';return}
if(!name||!phone||!S.date||S.slot===null){r.textContent='請填寫姓名、手機，並選擇日期與時段。';return}
r.textContent='';
if(!window.liff||!liff.isInClient()){alert("請在 LINE 裡面開啟此網頁才能送出預約訊息喔！\n錯誤訊息：非 LINE 內建瀏覽器");return}
const p2=n=>String(n).padStart(2,'0');
const date=S.date.getFullYear()+'-'+p2(S.date.getMonth()+1)+'-'+p2(S.date.getDate());
const time=p2(S.slot)+':00';
const duration=PL[S.p]+' 全方位放鬆整復';
const teacher=S.t==='any'?'不指定':S.t;
const oc=$('oc').value.trim();
let cond=S.av.length?S.av.join('、'):'無';
if(oc)cond+=`（補充：${oc}）`;
const note=$('mm').value.trim()||'無';
const messageText=`✅線上預約申請已送出✅
1、中文全名：${name}
2、聯絡電話：${phone}
3、預約日期：${date} ${time}
4、預約方案：${duration}
5、指定師父：${teacher}
6、得知管道：${S.src}
7、是否本人：${S.self}
8、先前經驗：${S.exp||'未填寫'}
9、特殊狀況：${cond}
10、留言備註：${note}`;
liff.sendMessages([{type:'text',text:messageText}]).then(()=>{
let msg="小編收到預約申請後會盡快回覆喔！謝謝 😊";
if(S.self==="否"){msg+="\n\n⚠️ 貼心提醒：非本人預約方案恕不適用會員優惠，將以原價計費：\n• 60分鐘：2,000元\n• 120分鐘：4,000元"}
alert(msg);liff.closeWindow();
}).catch(err=>{alert("發送失敗，請重試或直接私訊小編。\n錯誤訊息："+err.message)})};
draw();
</script>
</body>
</html>
